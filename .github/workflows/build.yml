name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore SandboxLauncher/SandboxLauncher.csproj -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }}

    - name: Build (Release ${{ matrix.platform }})
      run: dotnet build SandboxLauncher/SandboxLauncher.csproj -c Release -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }}

    - name: Publish (self-contained)
      run: dotnet publish SandboxLauncher/SandboxLauncher.csproj -f net8.0-windows10.0.19041.0 -c Release -r win-${{ matrix.platform }} --self-contained true -p:Platform=${{ matrix.platform }} -p:PublishSingleFile=false

    - name: Prepare Artifact
      run: |
        $exe = Get-ChildItem -Path . -Recurse -Filter "SandboxLauncher.exe" | Where-Object { $_.FullName -like "*publish*" } | Select-Object -First 1
        if (-not $exe) {
          $exe = Get-ChildItem -Path . -Recurse -Filter "SandboxLauncher.exe" | Select-Object -First 1
        }
        if (-not $exe) {
          throw "Could not find SandboxLauncher.exe after publish!"
        }
        $publishDir = $exe.DirectoryName
        Write-Host "Found SandboxLauncher.exe in: $publishDir"
        New-Item -ItemType Directory -Force -Path artifact-output
        Copy-Item -Path "$publishDir\*" -Destination artifact-output -Recurse -Force
        Write-Host "Artifact contents:"
        Get-ChildItem -Path artifact-output | Select-Object Name, Length | Format-Table -AutoSize

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandboxLauncher-win-${{ matrix.platform }}
        path: artifact-output/
        retention-days: 30
