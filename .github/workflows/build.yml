name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore SandboxLauncher/SandboxLauncher.csproj -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }}

    - name: Build (Release ${{ matrix.platform }})
      shell: cmd
      run: |
        dotnet build SandboxLauncher\SandboxLauncher.csproj -c Release -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }} -v normal
        if errorlevel 1 exit /b 1

    - name: Publish (self-contained)
      shell: cmd
      run: |
        dotnet publish SandboxLauncher\SandboxLauncher.csproj -f net8.0-windows10.0.19041.0 -c Release -r win-${{ matrix.platform }} --self-contained true -p:Platform=${{ matrix.platform }} -p:PublishSingleFile=false -o publish
        if errorlevel 1 exit /b 1
        dir publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandboxLauncher-win-${{ matrix.platform }}
        path: publish/
        retention-days: 30
