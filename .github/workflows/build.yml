name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore SandboxLauncher/SandboxLauncher.csproj -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }}

    - name: Build (Release ${{ matrix.platform }})
      shell: cmd
      run: |
        dotnet build SandboxLauncher\SandboxLauncher.csproj -c Release -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }} -v normal > "%GITHUB_WORKSPACE%\build.log" 2>&1
        type "%GITHUB_WORKSPACE%\build.log"
        if errorlevel 1 exit /b 1

    - name: Publish (self-contained)
      run: >
        dotnet publish SandboxLauncher/SandboxLauncher.csproj
        -c Release
        -r win-${{ matrix.platform }}
        --self-contained
        -p:Platform=${{ matrix.platform }}
        -p:PublishSingleFile=false
        -o publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandboxLauncher-win-${{ matrix.platform }}
        path: publish/
        retention-days: 30

    - name: Dump log to summary on failure
      if: failure()
      run: |
        if (Test-Path "$env:GITHUB_WORKSPACE\build.log") {
          "### Build Log Output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Content "$env:GITHUB_WORKSPACE\build.log" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        }

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.platform }}
        path: ${{ github.workspace }}\build.log
