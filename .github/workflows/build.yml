name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore SandboxLauncher/SandboxLauncher.csproj

    - name: Build (Release ${{ matrix.platform }})
      run: >
        dotnet build SandboxLauncher/SandboxLauncher.csproj
        -c Release
        -p:Platform=${{ matrix.platform }}
        --no-restore

    - name: Publish (self-contained)
      run: >
        dotnet publish SandboxLauncher/SandboxLauncher.csproj
        -c Release
        -r win-${{ matrix.platform }}
        --self-contained
        -p:Platform=${{ matrix.platform }}
        -p:PublishSingleFile=false
        -o publish

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: SandboxLauncher-win-${{ matrix.platform }}
        path: publish/
        retention-days: 30
